apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-cicd
  labels:
    app: app-cicd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-cicd
  template:
    metadata:
      labels:
        app: app-cicd
    spec:
      containers:
        - name: app-cicd
          image: cristiancave/app-cicd:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"